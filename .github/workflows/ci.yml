name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy

  test:
    name: Tests + dbt build (DuckDB)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Unit + end-to-end tests (runs dbt build twice incl. snapshot & unit tests)
        run: pytest --cov --cov-report=term-missing
      - name: Full pipeline run
        run: revintel run --target local --generate --customers 2000
      - name: dbt docs
        run: dbt docs generate --project-dir dbt --profiles-dir dbt --target local
        env:
          REVINTEL_DUCKDB_PATH: ${{ github.workspace }}/output/revintel.duckdb
      - uses: actions/upload-artifact@v4
        with:
          name: pipeline-output
          path: |
            data/lake/dq/
            output/powerbi/*.csv
            dbt/target/index.html
            dbt/target/manifest.json
            dbt/target/catalog.json

  airflow:
    name: Airflow DAG integrity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e . apache-airflow pytest
      - run: pytest tests/test_airflow_dag.py -v
        env:
          AIRFLOW_HOME: ${{ runner.temp }}/airflow

  docker:
    name: Container build + smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: revintel:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run the full pipeline inside the image
        run: docker run --rm revintel:ci run --target local --generate --customers 300
