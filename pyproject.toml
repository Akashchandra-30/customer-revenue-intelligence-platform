[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "revintel"
version = "2.0.0"
description = "Customer & Revenue Intelligence Platform: Python ETL, Azure, Snowflake, dbt and Power BI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "pydantic-settings>=2.4",
    "tenacity>=8.2",
    "requests>=2.31",
    "duckdb>=1.1",
    "dbt-core>=1.10,<2.0",
    "dbt-duckdb>=1.9",
]

[project.optional-dependencies]
snowflake = ["snowflake-connector-python[pandas]>=3.12", "dbt-snowflake>=1.9"]
azure = ["azure-storage-blob>=12.19", "azure-identity>=1.17"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "mypy>=1.11", "pre-commit>=3.8", "types-requests"]

[project.scripts]
revintel = "revintel.cli:main"

[tool.setuptools.packages.find]
include = ["revintel*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that run dbt (deselect with -m 'not slow')"]
addopts = "-ra"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dbt/dbt_packages", "dbt/target"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL", "RUF"]
ignore = ["PLR0913", "PLR0917", "PLR2004", "PLC0415", "RUF001", "E501", "UP037"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "S101"]

[tool.mypy]
python_version = "3.12"
packages = ["revintel"]
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true

[tool.coverage.run]
source = ["revintel"]
omit = ["revintel/powerbi.py", "revintel/azure_storage.py"]
